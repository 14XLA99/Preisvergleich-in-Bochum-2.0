<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preisvergleich in Bochum</title>
  <link rel="stylesheet" href="./style.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <h1>🛒 Preisvergleich in Bochum</h1>
  <div id="map"></div>

  <!-- Modal: Preise eintragen -->
  <div id="formModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button id="closeBtn" class="close-btn" aria-label="Modal schließen">×</button>
      <h2 id="form-title">Preise eintragen</h2>
      <form id="priceForm">
        <div class="form-group">
          <label>Brot (€): <input type="number" step="0.01" name="Brot" required /></label>
          <label>Milch (€): <input type="number" step="0.01" name="Milch" required /></label>
          <label>Äpfel (€): <input type="number" step="0.01" name="Äpfel" required /></label>
          <label>Butter (€): <input type="number" step="0.01" name="Butter" required /></label>
          <label>Nudeln (€): <input type="number" step="0.01" name="Nudeln" required /></label>

          <!-- 📸 Bild-Upload -->
          <label>Foto (optional): <input type="file" name="bild" id="bildUpload" /></label>
          <div id="bildName" class="bild-name">Kein Bild vorhanden</div>
        </div>
        <button type="submit">Eintragen</button>
      </form>
    </div>
  </div>

  <!-- Modal: Stepper -->
  <div id="stepperModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button id="stepperCloseBtn" class="close-btn" aria-label="Stepper schließen">×</button>
      <div id="step-content"></div>
      <div class="step-controls">
        <button id="prevStep">← Zurück</button>
        <div id="stepIndicators" class="step-indicators"></div>
        <button id="nextStep">Weiter →</button>
      </div>
    </div>
  </div>

  <!-- Haupt-Skript -->
  <script type="module" src="./main.js"></script>
</body>
</html>
