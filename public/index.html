<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preisvergleich in Bochum</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <h1>🛒 Preisvergleich in Bochum</h1>
  <div id="map"></div>

  <!-- Stepper-Modal -->
  <div id="stepperModal" class="modal hidden">
    <div class="modal-content">
      <span id="stepperCloseBtn">&times;</span>
      <h2 id="stepper-title">Produktdaten eintragen</h2>
      <div id="step-content"></div>
      <div class="step-nav">
        <button id="prevStep">← Zurück</button>
        <div id="stepIndicators"></div>
        <button id="nextStep">Weiter →</button>
      </div>
    </div>
  </div>

  <!-- Main Script -->
  <script type="module" src="./main.js"></script>
</body>
</html>
